name: wg-ros-receiver

services:
  wireguard:
    image: wg-ros-tunnel:local
    build:
      context: .
      dockerfile: docker/wireguard/Dockerfile
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    volumes:
      - type: bind
        source: ./wg/Client1.conf
        target: /config/client.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "ip -4 address show dev wg0 | grep -q 'inet ' && wg show wg0 >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  receiver:
    image: wg-ros-transfer:local
    build: .
    network_mode: service:wireguard
    depends_on:
      wireguard:
        condition: service_healthy
    environment:
      WG_LOCAL_IP: 10.10.0.4
      WG_PEER_IP: 10.10.0.3
      ROS_DOMAIN_ID: ${WG_TEST_ROS_DOMAIN_ID:-42}
      OUTPUT_DIR: /data/received
    volumes:
      - ./received:/data/received
    command: [receiver.py]
    init: true
    restart: unless-stopped
